name: DSE Daily EOD

on:
  workflow_dispatch:
  schedule:
    # 14:35 Bangladesh time = 08:35 UTC
    # Sunday-Thursday (DSE trading days)
    - cron: "35 8 * * 0-4"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run DSE feeder
        run: python dse_cloud_feeder.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          find data -type f -maxdepth 4 -print | sort

      - name: Commit daily archive
        run: |
          git config user.name "DSE Daily Feeder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dse_data_feeder.log
          git diff --cached --quiet || git commit -m "DSE EOD data $(date -u +%Y-%m-%d)"
          git push
