                      --navy:#06203a;
                      --navy2:#0b3155;
                      --blue:#0878ee;
                      --blue2:#075dc5;
                      --green:#10a968;
                      --green2:#0b8d57;
                      --yellow:#f4b72a;
                      --text:#122743;
                      --muted:#687b91;
                      --line:#dfe8f1;
                      --bg:#f4f8fc;
                      --white:#fff;
                      --soft:#eef6ff;
                      --shadow:0 8px 24px rgba(18,39,67,.08);
                  }}

                  * {{ box-sizing:border-box; }}
                  html {{ scroll-behavior:smooth; }}
                  body {{
                      margin:0;
                      background:var(--bg);
                      color:var(--text);
                      font-family:Inter,ui-sans-serif,system-ui,-apple-system,
                          BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
                  }}
                  a {{ color:inherit; }}
                  button,input {{ font:inherit; }}

                  .topbar {{
                      width:100%;
                      min-height:70px;
                      background:linear-gradient(100deg,#041a30,#07355c);
                      color:#fff;
                      display:flex;
                      align-items:center;
                      justify-content:space-between;
                      gap:24px;
                      padding:0 34px;
                      border-bottom:1px solid rgba(255,255,255,.10);
                  }}
                  .brand {{
                      display:flex;
                      align-items:center;
                      gap:11px;
                      min-width:235px;
                  }}
                  .brand-mark {{
                      width:42px;height:42px;border-radius:10px;
                      display:flex;align-items:flex-end;justify-content:center;
                      padding-bottom:6px;
                      background:linear-gradient(135deg,#17bf78,#0a8eea);
                      font-size:26px;font-weight:900;
                      box-shadow:0 8px 20px rgba(0,0,0,.18);
                  }}
                  .brand-name {{ font-size:21px;font-weight:850;letter-spacing:.2px; }}
                  .brand-sub {{
                      display:block;margin-top:1px;
                      font-size:10px;letter-spacing:.8px;
                      color:rgba(255,255,255,.68);
                  }}
                  .nav {{
                      display:flex;align-items:center;gap:31px;
                      font-size:13px;font-weight:700;color:rgba(255,255,255,.82);
                  }}
                  .nav a {{
                      text-decoration:none;padding:25px 0 22px;
                      border-bottom:3px solid transparent;
