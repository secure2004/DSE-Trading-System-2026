name: DSE Daily EOD

on:
workflow_dispatch:

schedule:
# 14:40 Bangladesh time (UTC+6)
# = 08:40 UTC
#
# Run every day so exceptional DSE trading days
# such as a Saturday opened for Eid adjustment
# are not missed.
#
# The Python feeder's DSE official-date gate
# is the final authority on whether data is collected.
- cron: "40 8 * * *"

permissions:
contents: write

jobs:

download:
runs-on: ubuntu-latest

```
steps:

  # =====================================================
  # 1. CHECKOUT
  # =====================================================

  - name: Checkout repository
    uses: actions/checkout@v5


  # =====================================================
  # 2. SETUP PYTHON
  # =====================================================

  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"
      cache: "pip"


  # =====================================================
  # 3. INSTALL DEPENDENCIES
  # =====================================================

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt


  # =====================================================
  # 4. RUN DSE FEEDER
  # =====================================================

  - name: Run DSE feeder
    run: |
      python dse_cloud_feeder.py


  # =====================================================
  # 5. SHOW GENERATED FILES
  # =====================================================

  - name: Show generated files
    run: |
      echo "========================================"
      echo "GENERATED DSE DATA FILES"
      echo "========================================"

      if [ -d "data" ]; then
        find data -type f -print | sort
      else
        echo "ERROR: data directory was not created."
        exit 1
      fi


  # =====================================================
  # 6. COMMIT DAILY DATA
  # =====================================================

  - name: Commit daily archive
    run: |

      git config user.name "DSE Daily Feeder"

      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"


      # -------------------------------------------------
      # Add daily DSE data.
      #
      # dse_data_feeder.log remains ignored.
      # -------------------------------------------------

      git add data


      # -------------------------------------------------
      # Commit only when data changed.
      # -------------------------------------------------

      if git diff --cached --quiet; then

        echo "No new files to commit."

      else

        git commit \
          -m "DSE EOD data $(date -u +%Y-%m-%d)"

        git push

      fi
