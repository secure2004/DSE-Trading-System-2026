                      );
                      transform: skewY(-12deg);
                      pointer-events: none;
                  }}

                  .topbar {{
                      position: relative;
                      z-index: 2;
                      max-width: 1240px;
                      margin: 0 auto;
                      min-height: 72px;
                      display: flex;
                      align-items: center;
