                              </div>

                              <a class="year-download"
                                 href="/downloads/{latest_year}/DSE_EOD_{latest_year}.zip">
                                  ⬇ Download {latest_year} — Full Year
                              </a>

                          </div>

                      </div>

                  </div>




                  <div id="archive">

                      {archive_html}

                  </div>



                  <footer id="about">
                      <span class="footer-brand">DSE DATA</span>
                      &nbsp;·&nbsp; DSE Daily Market Data Archive
                      <br>
                      Historical daily DSE market data including DSE stocks,
                      SME securities, DSEX, DSES and DS30.
                      <br>
                      Total files: {total_files}
                      &nbsp;·&nbsp; Years: {year_count}
                      &nbsp;·&nbsp; Months: {month_count}
                      &nbsp;·&nbsp; Latest: {latest_date}
                  </footer>


              </div>


              <script>

                  const search =
                      document.getElementById("search");

                  search.addEventListener(
                      "input",
                      function() {{

                          const query =
                              this.value
                                  .trim()
                                  .toLowerCase();

                          const years =
                              document.querySelectorAll(
                                  ".year-section"
                              );

                          years.forEach(
                              function(year) {{

                                  let yearVisible = false;

                                  const months =
                                      year.querySelectorAll(
                                          ".month-section"
                                      );

                                  months.forEach(
                                      function(month) {{

                                          let monthVisible =
                                              false;

                                          const rows =
                                              month.querySelectorAll(
                                                  ".day-row"
                                              );

                                          rows.forEach(
                                              function(row) {{

                                                  const text =
                                                      row.dataset.search ||
                                                      row.innerText.toLowerCase();

                                                  const visible =
                                                      !query ||
                                                      text.includes(query);

                                                  row.classList.toggle(
                                                      "hidden",
                                                      !visible
                                                  );

                                                  if (visible) {{
                                                      monthVisible = true;
                                                  }}

                                              }}
                                          );

                                          month.classList.toggle(
                                              "hidden",
                                              !monthVisible
                                          );

                                          if (monthVisible) {{
                                              yearVisible = true;
                                          }}

                                      }}
                                  );

                                  year.classList.toggle(
                                      "hidden",
                                      !yearVisible
                                  );

                              }}
                          );

                      }}
                  );

              </script>

          </body>

          </html>
          """

          (root / "index.html").write_text(
              html,
              encoding="utf-8"
          )

          print(
              f"Homepage generated with "
              f"{total_files} CSV files."
          )

          PY


