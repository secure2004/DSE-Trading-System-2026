                              </div>

                              <div class="stat">
                                  <span class="stat-value">{latest_date}</span>
                                  <span class="stat-label">Latest trading date</span>
                              </div>

                          </div>

                          <div class="tools">

                              <div class="search-wrap">
                                  <span class="search-icon">⌕</span>
                                  <input
                                      id="search"
                                      class="search-box"
