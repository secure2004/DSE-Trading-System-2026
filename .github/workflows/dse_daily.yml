                      width:37px;height:37px;border-radius:9px;
                      background:#edf5ff;color:#0878ee;
                      display:grid;place-items:center;font-size:22px;
                  }}
                  .archive-top h2 {{ margin:0;font-size:23px; }}
                  .archive-top p {{ margin:3px 0 0;color:var(--muted);font-size:11px; }}
                  .result-count {{ color:var(--muted);font-size:11px;font-weight:700; }}

                  .year-card {{
                      border:1px solid var(--line);border-radius:10px;
                      margin-bottom:11px;overflow:hidden;background:#fff;
                  }}
                  .year-main-head {{
                      display:flex;align-items:center;justify-content:space-between;
                      gap:12px;padding:12px 13px;
                      background:linear-gradient(90deg,#f7fbff,#fff);
                      border-bottom:1px solid var(--line);
                  }}
                  .archive-year-title {{ display:flex;align-items:center;gap:10px; }}
                  .archive-calendar {{
                      width:37px;height:37px;border-radius:9px;
                      display:grid;place-items:center;background:#eef6ff;
                      color:#0878ee;font-size:21px;
                  }}
                  .year-main-head h2 {{ margin:0;font-size:23px; }}
                  .year-main-head p {{
                      margin:3px 0 0;color:var(--muted);font-size:11px;
                  }}
                  .full-year-btn {{
                      display:flex;flex-direction:column;align-items:center;justify-content:center;
                      min-width:215px;min-height:44px;padding:6px 12px;
                      border-radius:8px;background:#0878ee;color:#fff;
                      text-decoration:none;font-size:11px;font-weight:850;
                  }}
                  .full-year-btn small {{ font-size:9px;font-weight:600;opacity:.84;margin-top:2px; }}

                  .month-card {{
                      margin:10px;border:1px solid var(--line);
                      border-radius:9px;overflow:hidden;
                  }}
                  .month-head {{
                      min-height:52px;padding:8px 10px;
                      display:flex;align-items:center;justify-content:space-between;
                      gap:10px;background:#f3f9ff;border-bottom:1px solid var(--line);
                  }}
                  .month-title-wrap {{ display:flex;align-items:center;gap:9px; }}
                  .month-icon {{
                      width:31px;height:31px;border-radius:7px;
                      display:grid;place-items:center;background:#fff0ee;
                      color:#ef4e45;font-size:17px;
                  }}
                  .month-head h3 {{ margin:0;font-size:16px; }}
                  .month-head span {{ color:var(--muted);font-size:10px; }}
                  .month-actions {{ display:flex;align-items:center;gap:6px; }}
                  .zip-btn {{
                      min-width:185px;padding:7px 10px;border:1px solid #b8d5f5;
                      border-radius:7px;background:#f5faff;color:#075fc9;
                      text-decoration:none;font-size:10px;font-weight:850;
                      text-align:center;
                  }}
                  .zip-btn small {{ display:block;font-size:9px;font-weight:600;color:#5c7894;margin-top:2px; }}
                  .collapse-btn {{
                      width:31px;height:31px;border:1px solid #cfe0ee;
                      border-radius:7px;background:#fff;color:#0878ee;cursor:pointer;
                  }}
                  .month-card.collapsed .file-table {{ display:none; }}
                  .month-card.collapsed .collapse-btn {{ transform:rotate(180deg); }}

                  .file-header,.file-row {{
                      display:grid;
                      grid-template-columns:100px minmax(180px,1.1fr) minmax(200px,1.4fr) 75px 150px;
                      align-items:center;gap:10px;
                  }}
                  .file-header {{
                      min-height:31px;padding:0 11px;
                      color:#334e6a;font-size:10px;font-weight:850;
                      border-bottom:1px solid var(--line);
                  }}
                  .file-row {{
                      min-height:38px;padding:3px 11px;
                      border-bottom:1px solid #edf2f6;font-size:10px;
                  }}
                  .file-row:last-child {{ border-bottom:0; }}
                  .file-row.hidden {{ display:none; }}
                  .file-date {{ font-weight:700;color:#233e5b; }}
                  .file-name {{
                      color:#086ee2;text-decoration:none;
                      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
                      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                  }}
                  .file-name:hover {{ text-decoration:underline; }}
                  .file-description {{ color:#49647e; }}
                  .file-size {{ color:#607991;font-weight:650; }}
                  .csv-btn {{
                      display:inline-flex;align-items:center;justify-content:center;
                      min-height:27px;border-radius:6px;
                      background:#0baa65;color:#fff;text-decoration:none;
                      font-size:10px;font-weight:850;
                  }}
                  .empty-state {{
                      padding:50px;text-align:center;color:var(--muted);
                  }}

                  .info-grid {{
                      display:grid;grid-template-columns:repeat(4,1fr);
                      gap:10px;margin-top:12px;
                  }}
                  .info-card {{
                      min-height:105px;background:#fff;border:1px solid var(--line);
                      border-radius:9px;padding:12px;box-shadow:var(--shadow);
                  }}
                  .info-card h3 {{ margin:0 0 6px;font-size:13px; }}
                  .info-card p {{ margin:0;color:#58708a;font-size:10px;line-height:1.55; }}
                  .info-icon {{
                      float:left;margin-right:8px;font-size:18px;color:#0878ee;
                  }}

                  footer {{
                      width:100%;background:#05223d;color:rgba(255,255,255,.72);
                      padding:22px 30px;font-size:11px;
                  }}
                  .footer-inner {{
                      max-width:1500px;margin:0 auto;
                      display:flex;align-items:center;justify-content:space-between;
                      gap:20px;
                  }}
                  .footer-brand {{ color:#fff;font-weight:850;font-size:14px; }}
                  .footer-meta {{ text-align:right; }}

                  .no-results {{
                      display:none;padding:35px;text-align:center;
                      color:var(--muted);font-size:13px;
                  }}
                  .no-results.show {{ display:block; }}

                  @media (max-width:1100px) {{
                      .topbar {{ padding:0 20px; }}
                      .updated {{ display:none; }}
                      .stats {{ grid-template-columns:repeat(3,1fr);padding:0 20px 16px; }}
                      .workspace {{ grid-template-columns:210px minmax(0,1fr);padding:16px 20px 30px; }}
                      .filter-bar {{ grid-template-columns:1fr 130px 130px 78px; }}
                      .download-latest {{ grid-column:1 / -1; }}
                      .file-header,.file-row {{
                          grid-template-columns:85px minmax(150px,1fr) 120px 135px;
                      }}
                      .file-header span:nth-child(3),.file-row .file-description {{ display:none; }}
                      .info-grid {{ grid-template-columns:repeat(2,1fr); }}
                  }}

                  @media (max-width:760px) {{
                      .topbar {{ min-height:62px;padding:0 14px; }}
                      .brand {{ min-width:auto; }}
                      .brand-name {{ font-size:17px; }}
                      .brand-sub {{ display:none; }}
                      .brand-mark {{ width:35px;height:35px;font-size:21px; }}
                      .nav {{ display:none; }}
                      .hero-inner {{ padding:21px 15px 18px; }}
                      .hero h1 {{ font-size:31px; }}
                      .hero-desc {{ font-size:16px; }}
                      .coverage-line {{ font-size:12px; }}
                      .stats {{ padding:0 15px 12px;grid-template-columns:repeat(2,1fr); }}
                      .stat:nth-child(5) {{ grid-column:1 / -1; }}
                      .workspace {{
                          display:block;padding:12px 15px 25px;
                      }}
                      .sidebar {{
                          position:static;max-height:none;margin-bottom:12px;
                      }}
                      .side-year:nth-child(n+12) {{ display:none; }}
                      .filter-bar {{
                          grid-template-columns:1fr 1fr;
                      }}
                      .input-wrap {{ grid-column:1 / -1; }}
                      .search-btn {{ grid-column:1; }}
                      .download-latest {{ grid-column:2; }}
                      .year-main-head {{ align-items:stretch;flex-direction:column; }}
                      .full-year-btn {{ width:100%; }}
                      .month-head {{ align-items:stretch;flex-direction:column; }}
                      .month-actions {{ width:100%; }}
                      .zip-btn {{ flex:1; }}
                      .file-header {{ display:none; }}
                      .file-row {{
                          grid-template-columns:80px minmax(0,1fr);
                          padding:9px 10px;gap:4px 9px;
                      }}
                      .file-name {{ font-size:10px; }}
                      .file-description,.file-size {{ display:none; }}
                      .csv-btn {{
                          grid-column:2;justify-self:start;padding:6px 12px;
                      }}
                      .info-grid {{ grid-template-columns:1fr; }}
                      .footer-inner {{ flex-direction:column;align-items:flex-start; }}
                      .footer-meta {{ text-align:left; }}
                  }}
              </style>
          </head>

          <body>
              <header class="topbar">
                  <div class="brand">
                      <div class="brand-mark">▥</div>
                      <div>
                          <div class="brand-name">DSE DATA</div>
                          <span class="brand-sub">BANGLADESH STOCK EXCHANGE</span>
                      </div>
                  </div>
                  <nav class="nav">
                      <a class="active" href="/">Home</a>
                      <a href="#archive">Browse</a>
                      <a href="#downloads">Downloads</a>
                      <a href="#data-fields">Data Fields</a>
                      <a href="#about">About</a>
                      <a href="#contact">Contact</a>
                  </nav>
                  <div class="updated">
                      <span class="live-dot"></span>
                      Last updated: {escape(latest_date_display)}, 14:40 (BDT)
                  </div>
              </header>

              <section class="hero">
                  <div class="hero-inner">
                      <div class="hero-copy">
                          <h1>DSE MARKET DATA ARCHIVE</h1>
                          <p class="hero-desc">
                              Bangladesh Stock Exchange historical EOD market data
                          </p>
                          <div class="coverage-line">
                              DSE stocks&nbsp;&nbsp;|&nbsp;&nbsp;SME securities&nbsp;&nbsp;|&nbsp;&nbsp;DSEX&nbsp;&nbsp;|&nbsp;&nbsp;DSES&nbsp;&nbsp;|&nbsp;&nbsp;DS30 index data
                          </div>
                      </div>
                  </div>

                  <div class="stats">
                      <div class="stat">
                          <span class="stat-value">{total_files}</span>
                          <span class="stat-label">Trading Days</span>
                          <span class="stat-detail">Total daily CSV files</span>
                      </div>
                      <div class="stat">
                          <span class="stat-value">{year_count}</span>
                          <span class="stat-label">Years With Data</span>
                          <span class="stat-detail">Archive coverage</span>
                      </div>
                      <div class="stat">
                          <span class="stat-value">{month_count}</span>
                          <span class="stat-label">Months Archived</span>
                          <span class="stat-detail">Across available years</span>
                      </div>
                      <div class="stat">
                          <span class="stat-value">{escape(latest_date_display)}</span>
                          <span class="stat-label">Latest Trading Date</span>
                          <span class="stat-detail">Most recent EOD data</span>
                      </div>
                      <div class="stat">
                          <span class="stat-value">{escape(latest_file)}</span>
                          <span class="stat-label">Latest File</span>
                          <span class="stat-detail">DSE + SME + DSEX + DSES + DS30</span>
                      </div>
                  </div>
              </section>

              <main class="workspace">
                  <aside class="sidebar" id="downloads">
                      <div class="side-title">
                          <div class="side-title-icon">↓</div>
                          <div>
                              <strong>Quick Download</strong>
                              <span>By Year (ZIP)</span>
                          </div>
                      </div>
                      {sidebar_html}
                  </aside>

                  <section class="main" id="archive">
                      <div class="filter-bar">
                          <div class="input-wrap">
                              <span class="search-symbol">⌕</span>
                              <input id="search" class="filter-input" type="search"
                                     placeholder="Search by filename or date (e.g. DSE_EOD, 2026-10-05)"
                                     autocomplete="off">
                          </div>
                          <input id="fromDate" class="date-input" type="date" aria-label="From date">
                          <input id="toDate" class="date-input" type="date" aria-label="To date">
                          <button class="search-btn" type="button" onclick="applyFilters()">Search</button>
                          <a class="download-latest" href="/downloads/{escape(latest_year)}/DSE_EOD_{escape(latest_year)}.zip">
                              <span>↓&nbsp; Download {escape(latest_year)} (Full Year ZIP)
                                  <small>All {latest_year_count} daily files</small>
                              </span>
                          </a>
                      </div>

                      <div class="archive-wrap">
                          <div class="archive-top">
                              <div class="archive-heading">
                                  <div class="archive-heading-icon">▣</div>
                                  <div>
                                      <h2>Archive</h2>
                                      <p>Year → Month → Trading Day</p>
                                  </div>
                              </div>
                              <div class="result-count" id="resultCount">
                                  {total_files} files
                              </div>
                          </div>

                          {archive_html}

                          <div class="no-results" id="noResults">
                              No files match your search or selected date range.
                          </div>
                      </div>

                      <div class="info-grid" id="data-fields">
                          <div class="info-card">
                              <span class="info-icon">◉</span>
                              <h3>Data Coverage</h3>
                              <p>DSE Stocks&nbsp; | &nbsp;SME Securities<br>
                              DSEX&nbsp; | &nbsp;DSES&nbsp; | &nbsp;DS30<br>
                              Open · High · Low · Close · Volume</p>
                          </div>
                          <div class="info-card">
                              <span class="info-icon">▤</span>
                              <h3>File Format</h3>
                              <p>CSV (Comma Separated Values)<br>
                              Suitable for Excel, AmiBroker, Python, R and other tools.</p>
                          </div>
                          <div class="info-card">
                              <span class="info-icon">▦</span>
                              <h3>Data Fields</h3>
                              <p>Ticker, Date, Open, High, Low, Close, Volume.</p>
                          </div>
                          <div class="info-card" id="about">
                              <span class="info-icon">ⓘ</span>
                              <h3>Data Source &amp; Methodology</h3>
                              <p>Daily EOD market archive containing DSE stocks, SME securities, DSEX, DSES and DS30 index data.</p>
                          </div>
                      </div>
                  </section>
              </main>

              <footer id="contact">
                  <div class="footer-inner">
                      <div>
                          <span class="footer-brand">DSE DATA</span><br>
                          Bangladesh Stock Exchange historical EOD market data
                      </div>
                      <div class="footer-meta">
                          Total Files: {total_files}
                          &nbsp; | &nbsp; Years With Data: {year_count}
                          &nbsp; | &nbsp; Months: {month_count}
                          &nbsp; | &nbsp; Latest Date: {escape(latest_date_display)}
                      </div>
                  </div>
              </footer>

              <script>
                  const search = document.getElementById("search");
                  const fromDate = document.getElementById("fromDate");
                  const toDate = document.getElementById("toDate");
                  const resultCount = document.getElementById("resultCount");
                  const noResults = document.getElementById("noResults");

                  function applyFilters() {{
                      const query = search.value.trim().toLowerCase();
                      const from = fromDate.value;
                      const to = toDate.value;
                      let visibleCount = 0;

                      document.querySelectorAll(".year-card").forEach(year => {{
                          let yearVisible = false;

                          year.querySelectorAll(".month-card").forEach(month => {{
                              let monthVisible = false;

                              month.querySelectorAll(".file-row").forEach(row => {{
                                  const text = (row.dataset.search || "").toLowerCase();
                                  const date = row.dataset.date || "";

                                  const textOk = !query || text.includes(query);
                                  const fromOk = !from || date >= from;
                                  const toOk = !to || date <= to;
                                  const visible = textOk && fromOk && toOk;

                                  row.classList.toggle("hidden", !visible);

                                  if (visible) {{
                                      monthVisible = true;
                                      visibleCount++;
                                  }}
                              }});

                              month.classList.toggle("hidden", !monthVisible);
                              if (monthVisible) yearVisible = true;
                          }});

                          year.classList.toggle("hidden", !yearVisible);
                      }});

                      resultCount.textContent =
                          visibleCount + (visibleCount === 1 ? " file" : " files");
                      noResults.classList.toggle("show", visibleCount === 0);
                  }}

                  search.addEventListener("input", applyFilters);
                  fromDate.addEventListener("change", applyFilters);
                  toDate.addEventListener("change", applyFilters);

                  function toggleMonth(button) {{
                      const card = button.closest(".month-card");
                      card.classList.toggle("collapsed");
                  }}
              </script>
          </body>
          </html>
          """

          (root / "index.html").write_text(html, encoding="utf-8")

          print(f"Professional homepage generated with {total_files} CSV files.")
          print(f"Sidebar years: {sidebar_years[0]} -> {sidebar_years[-1]}")

          PY

      # ============================================================
      # 9. SHOW PUBLIC SITE CONTENT
      # ============================================================

      - name: Verify public site
        run: |
          set -e

          echo "========================================"
          echo "PUBLIC SITE CONTENT"
          echo "========================================"

          echo ""
          echo "CSV files:"
          find public/DSEX -type f -name "*.csv" | sort

          echo ""
          echo "ZIP files:"
          find public/downloads -type f -name "*.zip" | sort

          echo ""
          echo "Homepage:"
          ls -lh public/index.html

          echo ""
          echo "Total CSV files:"
          find public/DSEX -type f -name "*.csv" | wc -l

          echo ""
          echo "Total ZIP files:"
          find public/downloads -type f -name "*.zip" | wc -l


      # ============================================================
      # 10. INSTALL WRANGLER
      # ============================================================

      - name: Install Wrangler
        run: |
          npm install -g wrangler


      # ============================================================
      # 11. DEPLOY COMPLETE SITE TO CLOUDFLARE PAGES
      # ============================================================

      - name: Publish complete site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          set -e

          echo "========================================"
          echo "DEPLOYING TO CLOUDFLARE PAGES"
          echo "========================================"

          echo "Cloudflare project:"
          echo "dsex-data"

          echo ""
          echo "Files being deployed:"
          find public -type f -print | sort

          echo ""
          echo "Deploying..."

          npx wrangler pages deploy public \
            --project-name=dsex-data \
            --branch=main

          echo ""
          echo "========================================"
          echo "CLOUDFLARE DEPLOYMENT COMPLETE"
          echo "========================================"


      # ============================================================
      # 12. SAVE NEW CSV INTO PRIVATE REPOSITORY ARCHIVE
      # ============================================================

      - name: Update private DSE archive
        run: |
          set -e

          echo "========================================"
          echo "UPDATING PRIVATE DSE ARCHIVE"
          echo "========================================"

          find . -maxdepth 1 -type d -regex "./20[0-9][0-9]" -print0 |
            while IFS= read -r -d "" year_dir; do
              cp -R "$year_dir" DSEX/
            done

          git config user.name "DSE Daily Feeder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DSEX

          if git diff --cached --quiet; then
            echo "No new private archive files to commit."
          else
            git commit -m "DSE EOD data $(date -u +%Y-%m-%d)"
            git push
          fi
