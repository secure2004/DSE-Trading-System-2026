name: DSE Daily EOD
on:
workflow_dispatch:
schedule:
- cron: "40 8 * * *"
permissions:
contents: write
jobs:
download:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v5
  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"
      cache: "pip"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt

  - name: Run DSE feeder
    run: python dse_cloud_feeder.py

  - name: Show generated files
    run: |
      if [ -d "data" ]; then
        find data -type f -print | sort
      else
        echo "ERROR: data directory was not created."
        exit 1
      fi

  - name: Commit daily archive
    run: |
      git config user.name "DSE Daily Feeder"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add data
      if git diff --cached --quiet; then
        echo "No new files to commit."
      else
        git commit -m "DSE EOD data $(date -u +%Y-%m-%d)"
        git push
      fi

