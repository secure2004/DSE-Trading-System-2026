name: DSE Daily EOD

on:
  workflow_dispatch:

  schedule:
    # 08:40 UTC = 14:40 Bangladesh time
    - cron: "40 8 * * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT PRIVATE REPOSITORY
      # ============================================================

      - name: Checkout private repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. SET UP PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # ============================================================
      # 4. RUN PRIVATE DSE FEEDER
      # ============================================================

      - name: Run DSE feeder
        run: |
          python dse_cloud_feeder.py


      # ============================================================
      # 5. VERIFY NEW CSV
      # ============================================================

      - name: Verify generated CSV
        run: |
          echo "========================================"
          echo "GENERATED DSE DATA"
          echo "========================================"

          find . -type f -name "DSE_EOD_*.csv" \
            -not -path "./DSEX/*" \
            -print | sort

          if ! find . -type f -name "DSE_EOD_*.csv" \
            -not -path "./DSEX/*" | grep -q .; then
            echo "ERROR: No newly generated DSE EOD CSV was found."
            echo "Expected pattern: YYYY/MM/DSE_EOD_YYYY-MM-DD.csv"
            exit 1
          fi


      # ============================================================
      # 6. BUILD COMPLETE PUBLIC CLOUDFLARE SITE
      # ============================================================

      - name: Build public Cloudflare site
        run: |
          set -e

          echo "========================================"
          echo "BUILDING PUBLIC CLOUDFLARE SITE"
          echo "========================================"

          rm -rf public
          mkdir -p public/DSEX
          mkdir -p public/downloads


          # --------------------------------------------------------
          # Copy existing archived DSEX files from private repo
          # --------------------------------------------------------

          if [ -d "DSEX" ]; then
            echo "Copying existing DSEX archive..."
            cp -R DSEX/. public/DSEX/
          else
            echo "No existing DSEX archive found."
          fi


          # --------------------------------------------------------
          # Copy today's newly generated data
          # --------------------------------------------------------

          echo "Copying new DSE data..."

          find . -maxdepth 1 -type d -regex "./20[0-9][0-9]" -print0 |
            while IFS= read -r -d "" year_dir; do
              cp -R "$year_dir" public/DSEX/
            done


          # --------------------------------------------------------
          # Show complete public archive
          # --------------------------------------------------------

          echo ""
          echo "Public CSV files:"
          find public/DSEX -type f -name "*.csv" -print | sort


      # ============================================================
      # 7. GENERATE MONTHLY AND YEARLY ZIP ARCHIVES
      # ============================================================

      - name: Generate ZIP archives
        run: |
          set -e

          echo "========================================"
          echo "GENERATING MONTHLY AND YEARLY ZIP FILES"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from collections import defaultdict

          root = Path("public/DSEX")
          downloads = Path("public/downloads")

          downloads.mkdir(parents=True, exist_ok=True)

          csv_files = sorted(
              root.rglob("DSE_EOD_*.csv")
          )

          if not csv_files:
              raise SystemExit("ERROR: No CSV files found.")

          print(f"Found {len(csv_files)} CSV files.")

          monthly = defaultdict(list)
          yearly = defaultdict(list)

          for file in csv_files:
              relative = file.relative_to(root)

              parts = relative.parts

              if len(parts) < 3:
                  print(f"Skipping unexpected path: {file}")
                  continue

              year = parts[0]
              month = parts[1]

              monthly[(year, month)].append(file)
              yearly[year].append(file)


          # --------------------------------------------------------
          # MONTHLY ZIP FILES
          # --------------------------------------------------------

          for (year, month), files in sorted(monthly.items()):

              output_dir = downloads / year / month
              output_dir.mkdir(parents=True, exist_ok=True)

              zip_path = output_dir / f"DSE_EOD_{year}-{month}.zip"

              with ZipFile(
                  zip_path,
                  "w",
                  compression=ZIP_DEFLATED
              ) as zf:

                  for file in sorted(files):
                      zf.write(
                          file,
                          arcname=file.name
                      )

              print(
                  f"MONTH ZIP: {zip_path} "
                  f"({len(files)} CSV files)"
              )


          # --------------------------------------------------------
          # YEARLY ZIP FILES
          # --------------------------------------------------------

          for year, files in sorted(yearly.items()):

              output_dir = downloads / year
              output_dir.mkdir(parents=True, exist_ok=True)

              zip_path = output_dir / f"DSE_EOD_{year}.zip"

              with ZipFile(
                  zip_path,
                  "w",
                  compression=ZIP_DEFLATED
              ) as zf:

                  for file in sorted(files):
                      relative = file.relative_to(root)

                      zf.write(
                          file,
                          arcname=str(relative)
                      )

              print(
                  f"YEAR ZIP: {zip_path} "
                  f"({len(files)} CSV files)"
              )


          print("")
          print("Generated ZIP files:")

          for zip_file in sorted(downloads.rglob("*.zip")):
              print(zip_file)

          PY


      # ============================================================
      # 8. GENERATE AUTOMATIC YEAR → MONTH → DAY HOMEPAGE
      # ============================================================

      - name: Generate public homepage
        run: |
          set -e

          echo "========================================"
          echo "GENERATING HOMEPAGE"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          from html import escape
          from collections import defaultdict
          import re

          root = Path("public")
          dsex = root / "DSEX"
          downloads = root / "downloads"

          csv_files = sorted(
              dsex.rglob("DSE_EOD_*.csv"),
              reverse=True
          )

          grouped = defaultdict(
              lambda: defaultdict(list)
          )

          pattern = re.compile(
              r"DSE_EOD_(\d{4})-(\d{2})-(\d{2})\.csv$"
          )

          for file in csv_files:

              match = pattern.match(file.name)

              if not match:
                  continue

              year, month, day = match.groups()

              grouped[year][month].append(
                  {
                      "day": day,
                      "file": file,
                  }
              )


          month_names = {
              "01": "January",
              "02": "February",
              "03": "March",
              "04": "April",
              "05": "May",
              "06": "June",
              "07": "July",
              "08": "August",
              "09": "September",
              "10": "October",
              "11": "November",
              "12": "December",
          }


          # --------------------------------------------------------
          # BUILD YEAR / MONTH / DAY HTML
          # --------------------------------------------------------

          sections = []

          for year in sorted(grouped.keys(), reverse=True):

              year_months = grouped[year]

              year_file_count = sum(
                  len(files)
                  for files in year_months.values()
              )

              year_zip = (
                  f"/downloads/{year}/"
                  f"DSE_EOD_{year}.zip"
              )

              year_html = f"""
              <section class="year-section"
                       data-year="{escape(year)}">

                  <div class="year-header">

                      <div>
                          <h2>{escape(year)}</h2>
                          <div class="year-count">
                              {year_file_count} daily files
                          </div>
                      </div>

                      <a class="year-download"
                         href="{escape(year_zip)}">
                          📦 Download Full Year
                      </a>

                  </div>
              """

              for month in sorted(
                  year_months.keys(),
                  reverse=True
              ):

                  files = sorted(
                      year_months[month],
                      key=lambda x: x["day"],
                      reverse=True
                  )

                  month_name = month_names.get(
                      month,
                      month
                  )

                  month_zip = (
                      f"/downloads/{year}/{month}/"
                      f"DSE_EOD_{year}-{month}.zip"
                  )

                  month_html = f"""
                  <div class="month-section"
                       data-year="{escape(year)}"
                       data-month="{escape(month)}">

                      <div class="month-header">

                          <div>
                              <h3>
                                  {escape(month_name)}
                                  {escape(year)}
                              </h3>

                              <div class="month-count">
                                  {len(files)} daily files
                              </div>
                          </div>

                          <a class="month-download"
                             href="{escape(month_zip)}">
                              📦 Download Full Month
                          </a>

                      </div>

                      <div class="day-list">
                  """

                  for item in files:

                      day = item["day"]
                      file = item["file"]

                      relative = (
                          file.relative_to(root)
                          .as_posix()
                      )

                      filename = file.name

                      month_html += f"""
                          <div class="day-row"
                               data-search="{escape(
                                   filename.lower()
                               )}">

                              <div class="day-info">

                                  <span class="day-date">
                                      {escape(day)}
                                  </span>

                                  <span class="day-filename">
                                      {escape(filename)}
                                  </span>

                              </div>

                              <a class="csv-download"
                                 href="/{escape(relative)}"
                                 download>
                                  ⬇ CSV
                              </a>

                          </div>
                      """

                  month_html += """
                      </div>
                  </div>
                  """

                  year_html += month_html

              year_html += """
              </section>
              """

              sections.append(year_html)


          if sections:
              archive_html = "\n".join(sections)
          else:
              archive_html = """
              <div class="empty">
                  No DSE data files are currently available.
              </div>
              """



          total_files = len(csv_files)

          available_years = sorted(grouped.keys(), reverse=True)
          year_count = len(available_years)
          month_count = sum(len(months) for months in grouped.values())

          latest_year = available_years[0] if available_years else ""
          latest_date = "—"

          if csv_files:
              latest_match = pattern.match(csv_files[0].name)
              if latest_match:
                  ly, lm, ld = latest_match.groups()
                  latest_year = ly
                  latest_date = f"{ld} {month_names.get(lm, lm)} {ly}"


          # --------------------------------------------------------
          # COMPLETE HOMEPAGE
          # --------------------------------------------------------

          html = f"""<!DOCTYPE html>
          <html lang="en">

          <head>

              <meta charset="UTF-8">

              <meta name="viewport"
                    content="width=device-width, initial-scale=1.0">

              <title>DSE Daily Market Data Archive</title>

              <meta name="description"
                    content="Bangladesh DSE daily market data archive including DSE stocks, SME securities, DSEX, DSES and DS30.">

              
              <style>
