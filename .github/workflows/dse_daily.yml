                      --line: #e4ebf3;
                      --bg: #f3f7fb;
                      --card: #ffffff;
                      --shadow: 0 12px 35px rgba(16,35,63,.08);
                  }}

                  * {{ box-sizing: border-box; }}

                  html {{ scroll-behavior: smooth; }}

                  body {{
                      margin: 0;
                      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                          BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
                      background: var(--bg);
                      color: var(--text);
                  }}

                  a {{ color: inherit; }}

                  .container {{
                      max-width: 1240px;
                      margin: 0 auto;
                      padding: 0 22px 44px;
                  }}

                  .hero {{
                      position: relative;
                      overflow: hidden;
                      margin: 0 -22px 28px;
                      padding: 0 22px 34px;
                      background:
                          radial-gradient(circle at 82% 15%, rgba(22,119,232,.28), transparent 30%),
                          radial-gradient(circle at 12% 85%, rgba(22,163,106,.16), transparent 28%),
                          linear-gradient(135deg, var(--navy), var(--navy-2));
                      color: white;
                  }}

                  .hero:after {{
                      content: "";
