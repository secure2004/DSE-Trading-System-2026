name: DSE Daily EOD

on:
  workflow_dispatch:
  schedule:
    - cron: "40 8 * * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run DSE feeder
        run: python dse_cloud_feeder.py

      - name: Verify generated data
        run: |
          echo "Generated CSV files:"
          find data -type f -name "*.csv" -print | sort

          if ! find data -type f -name "*.csv" | grep -q .; then
            echo "ERROR: No CSV files were generated."
            exit 1
          fi

      - name: Publish DSEX data to public repository
        env:
          DSEX_DATA_TOKEN: ${{ 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 }}
        run: |
          set -e

          echo "Preparing public DSEX repository..."

          git clone \
            "https://x-access-token:${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}@github.com/secure2004/DSEX-DATA.git" \
            public-data

          echo "Copying generated DSE data..."

          mkdir -p public-data/DSEX
          cp -R data/. public-data/DSEX/

          cd public-data

          git config user.name "DSE Daily Feeder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Public repository files:"
          find DSEX -type f -name "*.csv" -print | sort

          git add DSEX

          if git diff --cached --quiet; then
            echo "No new DSEX data to publish."
          else
            git commit -m "DSE EOD data $(date -u +%Y-%m-%d)"
            git push origin main
          fi
