name: DSE Daily EOD

on:
  workflow_dispatch:

  schedule:
    # 08:40 UTC = 14:40 Bangladesh time
    - cron: "40 8 * * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT PRIVATE REPOSITORY
      # ============================================================

      - name: Checkout private repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. SET UP PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # ============================================================
      # 4. RUN PRIVATE DSE FEEDER
      # ============================================================

      - name: Run DSE feeder
        run: |
          python dse_cloud_feeder.py


      # ============================================================
      # 5. VERIFY NEW CSV
      # ============================================================

      - name: Verify generated CSV
        run: |
          echo "========================================"
          echo "GENERATED DSE DATA"
          echo "========================================"

          find . -type f -name "DSE_EOD_*.csv" \
            -not -path "./DSEX/*" \
            -print | sort

          if ! find . -type f -name "DSE_EOD_*.csv" \
            -not -path "./DSEX/*" | grep -q .; then
            echo "ERROR: No newly generated DSE EOD CSV was found."
            echo "Expected pattern: YYYY/MM/DSE_EOD_YYYY-MM-DD.csv"
            exit 1
          fi


      # ============================================================
      # 6. BUILD COMPLETE PUBLIC CLOUDFLARE SITE
      # ============================================================

      - name: Build public Cloudflare site
        run: |
          set -e

          echo "========================================"
          echo "BUILDING PUBLIC CLOUDFLARE SITE"
          echo "========================================"

          rm -rf public
          mkdir -p public/DSEX
          mkdir -p public/downloads


          # --------------------------------------------------------
          # Copy existing archived DSEX files from private repo
          # --------------------------------------------------------

          if [ -d "DSEX" ]; then
            echo "Copying existing DSEX archive..."
            cp -R DSEX/. public/DSEX/
          else
            echo "No existing DSEX archive found."
          fi


          # --------------------------------------------------------
          # Copy today's newly generated data
          # --------------------------------------------------------

          echo "Copying new DSE data..."

          find . -maxdepth 1 -type d -regex "./20[0-9][0-9]" -print0 |
            while IFS= read -r -d "" year_dir; do
              cp -R "$year_dir" public/DSEX/
            done


          # --------------------------------------------------------
          # Show complete public archive
          # --------------------------------------------------------

          echo ""
          echo "Public CSV files:"
          find public/DSEX -type f -name "*.csv" -print | sort


      # ============================================================
      # 7. GENERATE MONTHLY AND YEARLY ZIP ARCHIVES
      # ============================================================

      - name: Generate ZIP archives
        run: |
          set -e

          echo "========================================"
          echo "GENERATING MONTHLY AND YEARLY ZIP FILES"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from collections import defaultdict

          root = Path("public/DSEX")
          downloads = Path("public/downloads")

          downloads.mkdir(parents=True, exist_ok=True)

          csv_files = sorted(
              root.rglob("DSE_EOD_*.csv")
          )

          if not csv_files:
              raise SystemExit("ERROR: No CSV files found.")

          print(f"Found {len(csv_files)} CSV files.")

          monthly = defaultdict(list)
          yearly = defaultdict(list)

          for file in csv_files:
              relative = file.relative_to(root)

              parts = relative.parts

              if len(parts) < 3:
                  print(f"Skipping unexpected path: {file}")
                  continue

              year = parts[0]
              month = parts[1]

              monthly[(year, month)].append(file)
              yearly[year].append(file)


          # --------------------------------------------------------
          # MONTHLY ZIP FILES
          # --------------------------------------------------------

          for (year, month), files in sorted(monthly.items()):

              output_dir = downloads / year / month
              output_dir.mkdir(parents=True, exist_ok=True)

              zip_path = output_dir / f"DSE_EOD_{year}-{month}.zip"

              with ZipFile(
                  zip_path,
                  "w",
                  compression=ZIP_DEFLATED
              ) as zf:

                  for file in sorted(files):
                      zf.write(
                          file,
                          arcname=file.name
                      )

              print(
                  f"MONTH ZIP: {zip_path} "
                  f"({len(files)} CSV files)"
              )


          # --------------------------------------------------------
          # YEARLY ZIP FILES
          # --------------------------------------------------------

          for year, files in sorted(yearly.items()):

              output_dir = downloads / year
              output_dir.mkdir(parents=True, exist_ok=True)

              zip_path = output_dir / f"DSE_EOD_{year}.zip"

              with ZipFile(
                  zip_path,
                  "w",
                  compression=ZIP_DEFLATED
              ) as zf:

                  for file in sorted(files):
                      relative = file.relative_to(root)

                      zf.write(
                          file,
                          arcname=str(relative)
                      )

              print(
                  f"YEAR ZIP: {zip_path} "
                  f"({len(files)} CSV files)"
              )


          print("")
          print("Generated ZIP files:")

          for zip_file in sorted(downloads.rglob("*.zip")):
              print(zip_file)

          PY


      # ============================================================
      # 8. GENERATE PROFESSIONAL DSE DATA PORTAL HOMEPAGE
      # ============================================================

      - name: Generate public homepage
        run: |
          set -e

          echo "========================================"
          echo "GENERATING PROFESSIONAL DSE DATA PORTAL"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          from html import escape
          from collections import defaultdict
          import re

          root = Path("public")
          dsex = root / "DSEX"
          downloads = root / "downloads"

          csv_files = sorted(
              dsex.rglob("DSE_EOD_*.csv"),
              reverse=True
          )

          pattern = re.compile(
              r"DSE_EOD_(\d{4})-(\d{2})-(\d{2})\.csv$"
          )

          month_names = {
              "01": "January", "02": "February", "03": "March",
              "04": "April", "05": "May", "06": "June",
              "07": "July", "08": "August", "09": "September",
              "10": "October", "11": "November", "12": "December",
          }

          grouped = defaultdict(lambda: defaultdict(list))

          for file in csv_files:
              match = pattern.match(file.name)
              if not match:
                  continue
              year, month, day = match.groups()
              grouped[year][month].append({
                  "day": day,
                  "file": file,
                  "date": f"{year}-{month}-{day}",
              })

          for year in grouped:
              for month in grouped[year]:
                  grouped[year][month].sort(
                      key=lambda x: x["date"], reverse=True
                  )

          total_files = len(csv_files)
          available_years = sorted(grouped.keys(), reverse=True)
          year_count = len(available_years)
          month_count = sum(len(months) for months in grouped.values())

          latest_date_iso = ""
          latest_date_display = "—"
          latest_year = str(max(
              2026,
              int(available_years[0]) if available_years else 2026
          ))

          if csv_files:
              for candidate in csv_files:
                  m = pattern.match(candidate.name)
                  if m:
                      y, mo, d = m.groups()
                      latest_date_iso = f"{y}-{mo}-{d}"
                      latest_date_display = f"{d} {month_names[mo]} {y}"
                      latest_year = y
                      break

          # Show the complete requested historical year range.
          # Years without uploaded data remain visible but are marked "No data".
          current_year = max(2026, int(latest_year))
          sidebar_years = list(range(current_year, 1999, -1))

          def year_file_count(year):
              return sum(
                  len(files)
                  for files in grouped.get(str(year), {}).values()
              )

          sidebar = []
          for year in sidebar_years:
              count = year_file_count(year)
              year_str = str(year)
              if count:
                  href = f"#year-{year_str}"
                  badge = '<span class="year-files">' + str(count) + ' files</span>'
                  if year_str == latest_year:
                      badge += '<span class="latest-badge">Latest</span>'
                  sidebar.append(
                      f'<a class="side-year" href="{href}" data-year="{year_str}">'
                      f'<span class="folder-icon">▰</span>'
                      f'<span class="side-year-name">{year_str}</span>'
                      f'{badge}</a>'
                  )
              else:
                  sidebar.append(
                      f'<div class="side-year unavailable" data-year="{year_str}">'
                      f'<span class="folder-icon">▰</span>'
                      f'<span class="side-year-name">{year_str}</span>'
                      f'<span class="year-files">No data</span></div>'
                  )

          sidebar_html = "\n".join(sidebar)

          sections = []

          for year in available_years:
              year_months = grouped[year]
              year_files_total = sum(len(files) for files in year_months.values())
              first_month = min(year_months.keys())
              last_month = max(year_months.keys())

              month_range = (
                  f"{month_names[first_month]} – "
                  f"{month_names[last_month]} {year}"
              )

              year_zip = f"/downloads/{year}/DSE_EOD_{year}.zip"

              month_sections = []

              for month in sorted(year_months.keys(), reverse=True):
                  files = year_months[month]
                  month_name = month_names[month]
                  month_zip = (
                      f"/downloads/{year}/{month}/"
                      f"DSE_EOD_{year}-{month}.zip"
                  )

                  rows = []
                  for item in files:
                      file = item["file"]
                      filename = file.name
                      relative = file.relative_to(root).as_posix()
                      size_mb = file.stat().st_size / (1024 * 1024)

                      rows.append(
                          f'''
                          <div class="file-row"
                               data-search="{escape((filename + ' ' + item['date']).lower())}"
                               data-date="{escape(item['date'])}">
                              <div class="file-date">{escape(item['date'])}</div>
                              <a class="file-name" href="/{escape(relative)}">
                                  {escape(filename)}
                              </a>
                              <div class="file-description">
                                  DSE Stocks + SME + DSEX + DSES + DS30
                              </div>
                              <div class="file-size">{size_mb:.1f} MB</div>
                              <a class="csv-btn" href="/{escape(relative)}" download>
                                  ↓&nbsp; Download CSV
                              </a>
                          </div>
                          '''
                      )

                  month_sections.append(
                      f'''
                      <section class="month-card" data-month="{escape(month)}">
                          <div class="month-head">
                              <div class="month-title-wrap">
                                  <div class="month-icon">▣</div>
                                  <div>
                                      <h3>{escape(month_name)} {escape(year)}</h3>
                                      <span>{len(files)} trading days</span>
                                  </div>
                              </div>
                              <div class="month-actions">
                                  <a class="zip-btn" href="{escape(month_zip)}">
                                      ↓&nbsp; Download {escape(month_name)} ZIP
                                      <small>{len(files)} daily files</small>
                                  </a>
                                  <button class="collapse-btn" type="button"
                                          aria-label="Collapse {escape(month_name)}"
                                          onclick="toggleMonth(this)">
                                     ⌃
                                  </button>
                              </div>
                          </div>
                          <div class="file-table">
                              <div class="file-header">
                                  <span>Date</span>
                                  <span>File Name</span>
                                  <span>Description</span>
                                  <span>Size</span>
                                  <span>Download</span>
                              </div>
                              {''.join(rows)}
                          </div>
                      </section>
                      '''
                  )

              sections.append(
                  f'''
                  <section class="year-card" id="year-{escape(year)}"
                           data-year="{escape(year)}">
                      <div class="year-main-head">
                          <div>
                              <div class="archive-year-title">
                                  <span class="archive-calendar">▣</span>
                                  <div>
                                      <h2>{escape(year)}</h2>
                                      <p>{year_files_total} trading days&nbsp;&nbsp;|&nbsp;&nbsp;{escape(month_range)}</p>
                                  </div>
                              </div>
                          </div>
                          <a class="full-year-btn" href="{escape(year_zip)}">
                              ↓&nbsp; Download {escape(year)} (Full Year ZIP)
                              <small>All {year_files_total} daily files</small>
                          </a>
                      </div>
                      {''.join(month_sections)}
                  </section>
                  '''
              )

          archive_html = "\n".join(sections) if sections else '''
              <div class="empty-state">
                  <strong>No DSE data files are currently available.</strong>
              </div>
          '''

          latest_file = (
              f"DSE_EOD_{latest_date_iso}.csv"
              if latest_date_iso else "—"
          )

          latest_year_count = year_file_count(latest_year)

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>DSE Market Data Archive</title>
              <meta name="description"
                    content="DSE market data archive with daily EOD CSV files, monthly ZIP archives and yearly ZIP archives.">
              <style>
