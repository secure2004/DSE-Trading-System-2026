name: DSE Daily EOD

on:
  workflow_dispatch:

  schedule:
    # 14:40 Bangladesh time = 08:40 UTC
    # Run every day.
    - cron: "40 8 * * *"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT PRIVATE REPOSITORY
      # =====================================================

      - name: Checkout private repository
        uses: actions/checkout@v5


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # =====================================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # =====================================================
      # 4. RUN PRIVATE DSE FEEDER
      # =====================================================

      - name: Run DSE feeder
        run: |
          python dse_cloud_feeder.py


      # =====================================================
      # 5. VERIFY GENERATED DATA
      # =====================================================

      - name: Verify generated CSV data
        run: |
          echo "Generated CSV files:"
          find data -type f -name "*.csv" -print | sort

          if ! find data -type f -name "*.csv" | grep -q .; then
            echo "ERROR: No CSV files were generated."
            exit 1
          fi


      # =====================================================
      # 6. INSTALL CLOUDFLARE WRANGLER
      # =====================================================

      - name: Install Wrangler
        run: |
          npm install -g wrangler


      # =====================================================
      # 7. PUBLISH ONLY DATA TO CLOUDFLARE PAGES
      # =====================================================

      - name: Publish DSEX data to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          set -e

          echo "========================================"
          echo "PUBLISHING DSEX DATA TO CLOUDFLARE"
          echo "========================================"

          echo "Cloudflare Pages project: dsex-data"

          echo "Files being published:"
          find data -type f -name "*.csv" -print | sort

          wrangler pages deploy data \
            --project-name=dsex-data \
            --branch=main

          echo "========================================"
          echo "CLOUDFLARE PUBLICATION COMPLETE"
          echo "========================================"
