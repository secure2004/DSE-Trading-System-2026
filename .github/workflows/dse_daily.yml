name: DSE Daily EOD

on:
  workflow_dispatch:

  schedule:
    # 14:35 Bangladesh time = 08:35 UTC
    # Sunday-Thursday
    - cron: "35 8 * * 0-4"

permissions:
  contents: write

jobs:

  download:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # =====================================================
      # 2. PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"
          cache: "pip"


      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # =====================================================
      # 4. RUN DSE FEEDER
      # =====================================================

      - name: Run DSE feeder
        run: |
          python dse_cloud_feeder.py


      # =====================================================
      # 5. SHOW GENERATED FILES
      # =====================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "GENERATED DSE DATA FILES"
          echo "========================================"

          find data -type f -print | sort


      # =====================================================
      # 6. COMMIT DAILY DATA
      # =====================================================

      - name: Commit daily archive
        run: |

          git config user.name "DSE Daily Feeder"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          git add dse_data_feeder.log

          if git diff --cached --quiet; then

            echo "No new files to commit."

          else

            git commit \
              -m "DSE EOD data $(date -u +%Y-%m-%d)"

            git push

          fi
